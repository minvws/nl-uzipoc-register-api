name: Rebuild python virtual env

on:
  push:
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV &&
          echo "PKG_NAME=`basename $GITHUB_REPOSITORY -private`" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - name: Configure git
        run: git config --global url."https://${{ secrets.REPO_READ_ONLY_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"

      - name: install requirements
        run: sudo apt-get update && sudo apt-get install libxmlsec1-dev

      - name: Install dependencies
        run:
            sudo apt-get update
            sudo apt-get install libxmlsec1-dev pkg-config
            python -m pip install --upgrade pip setuptools wheel
            pip install -r requirements.txt

      - name: prep
        run: sudo mkdir -p /var/www/html

      - name: chown
        run: sudo chown `id -u`:`id -g` /var/www/html

      - name: Copy files
        run: cp -r * /var/www/html

      - name: Create env
        run: cd /var/www/html; make venv

      - name: Create archive
        run: cd /var/www/html; tar -czf /home/runner/work/${{ env.PKG_NAME }}/${{ env.PKG_NAME }}/${{ env.PKG_NAME }}_venv_${{ env.RELEASE_VERSION }}.tar.gz .venv

      - name: Upload venv tar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}_venv_${{ env.RELEASE_VERSION }}
          path: ${{ env.PKG_NAME }}_venv_${{ env.RELEASE_VERSION }}.tar.gz
